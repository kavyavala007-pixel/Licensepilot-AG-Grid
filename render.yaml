# Render Blueprint for the public demo. Set optional integration credentials in
# the Render dashboard; never commit secrets to this file.
services:
  - type: web
    name: licensepilot
    env: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      # Add these in the Render dashboard (not in this file):
      # PAYPAL_CLIENT_ID
      # PAYPAL_CLIENT_SECRET
      # PAYPAL_WEBHOOK_ID
      # ANTHROPIC_API_KEY
      # AI_MODEL
      # APP_URL
